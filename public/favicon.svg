<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#grad)"/>
  <!-- Graduation cap: board -->
  <polygon points="32,16 52,25 32,34 12,25" fill="white" opacity="0.95"/>
  <!-- Cap top knob -->
  <circle cx="32" cy="16" r="2.5" fill="white" opacity="0.95"/>
  <!-- Left tassel string -->
  <line x1="12" y1="25" x2="12" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Tassel ball -->
  <circle cx="12" cy="40" r="3" fill="white" opacity="0.85"/>
  <!-- Right side of cap (3D fold) -->
  <path d="M44,29 L44,40 Q32,46 20,40 L20,29 Q32,35 44,29 Z" fill="white" opacity="0.25"/>
  <!-- Cap front face -->
  <path d="M44,29 L44,40 Q32,46 20,40 L20,29 Q32,35 44,29 Z" fill="white" opacity="0.6"/>
</svg>
