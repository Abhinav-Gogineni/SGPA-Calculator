<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f3e8ff"/>
      <stop offset="100%" style="stop-color:#e9d5ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d28d9"/>
      <stop offset="60%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft glow blobs -->
  <ellipse cx="300" cy="200" rx="420" ry="300" fill="url(#glow1)"/>
  <ellipse cx="1050" cy="520" rx="320" ry="220" fill="url(#glow2)"/>

  <!-- Border frame -->
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.2"/>

  <!-- Logo square — centered horizontally in left half -->
  <rect x="160" y="72" width="88" height="88" rx="20" fill="url(#brand)"/>
  <!-- Graduation cap -->
  <polygon points="204,96 236,109 204,122 172,109" fill="white" opacity="0.97"/>
  <circle cx="204" cy="96" r="4" fill="white"/>
  <line x1="172" y1="109" x2="172" y2="123" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <circle cx="172" cy="127" r="4" fill="white" opacity="0.85"/>
  <path d="M228,114 L228,125 Q204,133 180,125 L180,114 Q204,122 228,114 Z" fill="white" opacity="0.65"/>

  <!-- Main heading — centered -->
  <text x="600" y="252" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="800" fill="url(#title-grad)" text-anchor="middle" letter-spacing="-1">SGPA Calculator</text>

  <!-- Underline — centered -->
  <rect x="280" y="266" width="640" height="4" rx="2" fill="url(#brand)" opacity="0.45"/>

  <!-- Subtitle — centered -->
  <text x="600" y="322" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="400" fill="#6d28d9" text-anchor="middle">JNTUK R23  ·  CSE (Artificial Intelligence &amp; Machine Learning)</text>

  <!-- Description — centered -->
  <text x="600" y="390" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#7e6ea8" text-anchor="middle">Calculate your semester SGPA instantly with live credits,</text>
  <text x="600" y="424" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#7e6ea8" text-anchor="middle">grade points, and pass/fail status.</text>

  <!-- Divider -->
  <line x1="160" y1="500" x2="1040" y2="500" stroke="#a855f7" stroke-width="1" opacity="0.25"/>

  <!-- Developed by — centered, two elements with known widths -->
  <text x="520" y="556" font-family="system-ui,-apple-system,sans-serif" font-size="21" fill="#9d7ec9" text-anchor="end">Developed by</text>
  <text x="536" y="556" font-family="system-ui,-apple-system,sans-serif" font-size="21" font-weight="700" fill="url(#title-grad)" text-anchor="start">Abhinav</text>
</svg>
